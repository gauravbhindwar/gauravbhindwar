<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#131A22"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .display { font-family: 'Arial', sans-serif; font-weight: 800; }
      .mono { font-family: 'Courier New', monospace; }
      .body { font-family: 'Arial', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle grid texture -->
  <g opacity="0.05">
    <path d="M 0 80 H 1280 M 0 160 H 1280 M 0 240 H 1280 M 0 320 H 1280 M 0 400 H 1280 M 0 480 H 1280 M 0 560 H 1280" stroke="#00D9FF" stroke-width="1"/>
    <path d="M 160 0 V 640 M 320 0 V 640 M 480 0 V 640 M 640 0 V 640 M 800 0 V 640 M 960 0 V 640 M 1120 0 V 640" stroke="#00D9FF" stroke-width="1"/>
  </g>

  <!-- eyebrow label -->
  <text x="80" y="100" class="mono" font-size="16" fill="#00D9FF" letter-spacing="4">BACKEND · GENAI · AI INFRASTRUCTURE</text>
  <rect x="80" y="116" width="420" height="2" fill="url(#cyanGlow)"/>

  <!-- Name -->
  <text x="76" y="210" class="display" font-size="76" fill="#E8EDF2">Gaurav Kumar</text>

  <!-- Subheadline -->
  <text x="80" y="256" class="body" font-size="24" fill="#9BB0C2">Building production RAG systems and AI-agent infrastructure</text>

  <!-- Hash-chain signature motif -->
  <g transform="translate(80, 300)" filter="url(#softGlow)">
    <!-- block 1 -->
    <rect x="0" y="0" width="150" height="72" rx="10" fill="#151B23" stroke="#00D9FF" stroke-width="1.5"/>
    <text x="16" y="26" class="mono" font-size="12" fill="#5B8A9E">BLOCK 0</text>
    <text x="16" y="50" class="mono" font-size="13" fill="#00D9FF">a91f...3cd2</text>

    <!-- chain link -->
    <path d="M 150 36 L 190 36" stroke="#FFB86B" stroke-width="2.5"/>
    <circle cx="170" cy="36" r="5" fill="#FFB86B"/>

    <!-- block 2 -->
    <rect x="190" y="0" width="150" height="72" rx="10" fill="#151B23" stroke="#00D9FF" stroke-width="1.5"/>
    <text x="206" y="26" class="mono" font-size="12" fill="#5B8A9E">BLOCK 1</text>
    <text x="206" y="50" class="mono" font-size="13" fill="#00D9FF">7be0...91aa</text>

    <!-- chain link -->
    <path d="M 340 36 L 380 36" stroke="#FFB86B" stroke-width="2.5"/>
    <circle cx="360" cy="36" r="5" fill="#FFB86B"/>

    <!-- block 3 -->
    <rect x="380" y="0" width="150" height="72" rx="10" fill="#151B23" stroke="#00D9FF" stroke-width="1.5"/>
    <text x="396" y="26" class="mono" font-size="12" fill="#5B8A9E">BLOCK 2</text>
    <text x="396" y="50" class="mono" font-size="13" fill="#00D9FF">2f4c...e017</text>

    <!-- chain link -->
    <path d="M 530 36 L 570 36" stroke="#FFB86B" stroke-width="2.5"/>
    <circle cx="550" cy="36" r="5" fill="#FFB86B"/>

    <!-- signed checkpoint -->
    <rect x="570" y="-6" width="168" height="84" rx="10" fill="#0F2A22" stroke="#5EE6A8" stroke-width="1.5"/>
    <text x="586" y="20" class="mono" font-size="12" fill="#5EE6A8">CHECKPOINT</text>
    <text x="586" y="44" class="mono" font-size="13" fill="#5EE6A8">Ed25519 signed</text>
    <text x="586" y="62" class="mono" font-size="11" fill="#3E8F6E">verified checkpoint</text>
  </g>

  <!-- caption under motif -->
  <text x="80" y="430" class="mono" font-size="14" fill="#5B6B78" letter-spacing="1">tamper-evident audit ledger — from Turnstile, a self-hosted AI-agent gateway</text>

  <!-- stat strip -->
  <g transform="translate(80, 480)">
    <g>
      <text x="0" y="0" class="display" font-size="30" fill="#E8EDF2">20,000+</text>
      <text x="0" y="26" class="body" font-size="14" fill="#7C8FA0">PDF pages indexed</text>
    </g>
    <g transform="translate(260, 0)">
      <text x="0" y="0" class="display" font-size="30" fill="#E8EDF2">Hybrid</text>
      <text x="0" y="26" class="body" font-size="14" fill="#7C8FA0">FAISS + BM25 retrieval</text>
    </g>
    <g transform="translate(520, 0)">
      <text x="0" y="0" class="display" font-size="30" fill="#E8EDF2">500+</text>
      <text x="0" y="26" class="body" font-size="14" fill="#7C8FA0">users on MentorLink</text>
    </g>
    <g transform="translate(780, 0)">
      <text x="0" y="0" class="display" font-size="30" fill="#E8EDF2">Solo</text>
      <text x="0" y="26" class="body" font-size="14" fill="#7C8FA0">built, Turnstile gateway</text>
    </g>
  </g>

  <!-- footer -->
  <rect x="0" y="600" width="1280" height="1" fill="#1E2731"/>
  <text x="80" y="628" class="mono" font-size="14" fill="#5B6B78">github.com/gauravbhindwar</text>
  <text x="1200" y="628" class="mono" font-size="14" fill="#5B6B78" text-anchor="end">gauravbhindwar.dev</text>
</svg>
